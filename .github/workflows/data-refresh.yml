name: Weekly Dashboard Refresh

on:
  schedule:
    # Runs every Saturday at 00:00 UTC (12:00 midnight)
    - cron: '0 0 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"

      - name: Fetch repositories and issues via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          mkdir -p data/interim data/final
          gh repo list Asifdotexe --limit 150 --json name,description,updatedAt > data/interim/repos.json
          python -c "import json, csv; data = json.load(open('data/interim/repos.json', encoding='utf-8')); keys = ['name', 'description', 'updatedAt']; writer = csv.DictWriter(open('data/interim/repos.csv', 'w', encoding='utf-8', newline=''), fieldnames=keys); writer.writeheader(); writer.writerows(data)"
          uv run code/src/fetch_issues.py

      - name: Build dashboard
        run: uv run code/src/build_dashboard.py

      - name: Commit and push changes directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/interim/ data/final/ index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): weekly snapshot refresh"
            git push origin main
          fi
